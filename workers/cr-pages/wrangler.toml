# Cloudflare Worker 設定ファイル（HELLO PAGES）
# 設計書：Drive の toolbox/cr-pages/設計書.md
# 公開リポジトリに置くファイル。秘密情報・メールアドレスは書かない。

name = "cr-pages"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# 画面（静的ファイル）。/api・/s・/v だけ Worker が処理し、それ以外は静的ファイルをそのまま返す。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/s/*", "/v/*"]

# 公開されたファイル本体の保管庫。バケットは SETUP.md の手順で作成する。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cr-pages-files"

# ページ情報・パスワードのハッシュ・集計。
# database_id は SETUP.md の手順で `wrangler d1 create` した後に、表示された値へ差し替える。
# 下の 0 だけの値はローカル確認用の仮の値（このままではデプロイできない）。
[[d1_databases]]
binding = "DB"
database_name = "cr-pages-db"
database_id = "f745a864-65b9-45cc-bca9-08d825f6df4b"
migrations_dir = "migrations"

# 期限切れページの後始末（毎時0分）。
[triggers]
crons = ["0 * * * *"]

# 非機密の設定。
[vars]
# HELLO PAGES 専用の Google OAuth クライアントID（公開情報なので vars でよい）。
# Google Cloud Console で作成したら、ここに貼る（SETUP.md「Googleログインの準備」）。空のままだとログインできない。
GOOGLE_CLIENT_ID = "667021295506-c0dmplgif4mvvqbvsmn7nivfgee9c71c.apps.googleusercontent.com"

# --- 機密は toml に書かない。`npx wrangler secret put <名前>` で登録する（SETUP.md） ---
#   GOOGLE_CLIENT_SECRET … 上のクライアントのシークレット（認可コードの交換に使う）
#   VIEW_TOKEN_SECRET    … 閲覧用トークンの署名鍵（ランダムな長い文字列）
#   PASSWORD_PEPPER      … パスワードの保存値を作る鍵（ランダムな長い文字列）
#   USER_HASH_KEY        … 公開者の匿名ハッシュの鍵（ランダムな長い文字列。変更しない）
#   ADMIN_EMAILS         … 管理者ボードを見られる人のメール（カンマ区切り）。リポジトリにメールを書かないため Secret にする
