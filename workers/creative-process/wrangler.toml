# Cloudflare Worker 設定ファイル（制作依頼ツール CREATIVE PROCESS）
# 既存ツール（revision-share / project-board）と命名の系統を揃える。

name = "creative-process"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# KVストア。フェーズ3以降の用途＝冪等キー(idem:)・既知依頼者リスト(guest:)。
# form:/html: はフェーズ2以前の残置データ（読み出しのみ・TTLで自然消滅）。
[[kv_namespaces]]
binding = "REQUESTS"
id = "bbc21dc5a528436e8afe3623fdd282d6"

# --- 非機密の設定はここに（vars）。機密は Secrets で登録する（SETUP.md 参照） ---
[vars]
# 許可するフォームのオリジン（カンマ区切り可）。GitHub Pages の公開URLを入れる。
# 【フェーズ3 2026-07-24】旧オリジン yuki-m-15.github.io を退役（T4）。現行は crplayground のみ。
# 反映には `npx wrangler deploy` が必要（このファイルを書き換えただけでは反映されない）。
ALLOWED_ORIGIN = "https://crplayground.github.io"
# Notion APIバージョン（通常は変更不要）
NOTION_VERSION = "2022-06-28"
# 【チャット機能 2026-08-13】ヒアリーが使うGeminiのモデル名。
#   ここを空にすると chat.js の既定 gemini-2.5-flash になるが、
#   2026年に発行したAPIキーでは 2.5系が使えず 404 "no longer available to new users" になる。
#   P3の会話品質検証は gemini-3.6-flash で実施済み＝この値を正とする。
#   モデルを変えたら会話の挙動が変わるので、変更時はP3の5ケースを回し直すこと。
GEMINI_MODEL = "gemini-3.6-flash"
# 【フェーズ1】GISのOAuthクライアントID（公開情報なのでvarsでOK）。
# フォーム側 index.html の GOOGLE_CLIENT_ID と同じ値にすること。
# 空のままだと /submit が「サーバー設定が未完了です」を返す（＝ログイン必須が常に有効）。
GOOGLE_CLIENT_ID = "667021295506-c020jhqh9co7ou12q0r4kkchnqptf990.apps.googleusercontent.com"

# --- 機密（NOTION_TOKEN / NOTION_DB_ID / GOOGLE_CLIENT_SECRET）は toml に書かない ---
# 必ず `npx wrangler secret put <名前>` で登録する（SETUP.md 手順3）。
#
# 【GOOGLE_CLIENT_SECRET】ログイン方式を「認可コードフロー」に変えたため必須になった。
#   フォームの自作ログインボタン → 認可コード → Worker が /auth/exchange でIDトークンに交換する。
#   未登録の間は /auth/exchange が「サーバー設定が未完了です」を返し、ログインできない。
#   登録: cd workers/creative-process && npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# 【フェーズ3で不要になったもの】
#   FORM_URL / SHARE_URL_PROP（vars）… 共有URL廃止に伴い削除済み
#
# 【2026-08-11 白紙化で不要になったもの】
#   SLACK_WEBHOOK_URL（Secret）… Slack自動投稿の白紙化により廃止（コードも撤去済み）。
#   Secretが残っていても無害だが、`npx wrangler secret delete SLACK_WEBHOOK_URL` で掃除できる
#   （2026-07-25に削除済みのはずなので通常は何も残っていない）
#   CREATIVE_EDITOR_EMAILS（Secret）… 再編集機構の撤去で未使用。
#     登録済みなら `npx wrangler secret delete CREATIVE_EDITOR_EMAILS` で消してよい（残っていても無害）

# 【チャット機能 2026-08-13】Gemini APIキー
#   GEMINI_API_KEY … AI Studio（GCPプロジェクト creative-request）で発行したキー。
#   登録: cd workers/creative-process && npx wrangler secret put GEMINI_API_KEY
#   未登録だと /chat が500「サーバー設定が未完了です（GEMINI_API_KEY）」を返す（フォーム送信は無傷）。
#   ※課金はGCP側の月額上限で天井を張る。Worker側のレート制限（1人1日120回）はコードなので書き換えられる。

# 【V1-5 2026-08-06】Drive自動フォルダ作成のサービスアカウント
#   GOOGLE_SA_EMAIL       … サービスアカウントのメール（xxx@<project>.iam.gserviceaccount.com）
#   GOOGLE_SA_PRIVATE_KEY … 同アカウントの秘密鍵（JSON鍵の private_key の値をそのまま貼る）
#   どちらも `npx wrangler secret put <名前>` で登録する。tomlには書かない。
#   ※メール自体は機密ではないが、鍵と対で管理した方が事故が少ないためSecretに寄せている。
#   ※どちらか未設定ならフォルダ作成はスキップされ、依頼の登録だけが行われる（送信は成功する）。
#   ※サービスアカウントを共有ドライブ「CRAZY CREATIVE」のメンバー（コンテンツ管理者）に
#     追加しないと、権限エラーでフォルダが作れない。GCPの設定だけでは足りない点に注意。
